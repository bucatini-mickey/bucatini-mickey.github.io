# Refreshes films/recent.json (my recent Letterboxd diary) once a day, so the Film page stays current.
name: Letterboxd diary
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/letterboxd.py
      - run: |
          if ! git diff --quiet films/recent.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add films/recent.json
            git commit -m "Film: recent diary from Letterboxd"
            git push
          fi
