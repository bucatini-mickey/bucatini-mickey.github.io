# Refreshes music/playlists.json (names and covers of my Spotify playlists) once a week, so the Music page stays current.
name: Spotify playlists
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/spotify.py
      - run: |
          if ! git diff --quiet music/playlists.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add music/playlists.json
            git commit -m "Music: playlist names and covers from Spotify"
            git push
          fi
