<style>
/* After Rembrandt. In the dark, a painting: warm light falling from the upper left into umber darkness, the lit
   area built up in thick impasto strokes, the shadows sketched over in etched hatching that thickens as the light
   goes. In the light, the same picture as one of his etchings: sepia lines on ivory paper. One faint compass
   circle is all that is left of the geometry. No writing but the page's own. The picture drifts up more slowly
   than the page. Light mode is the default here (the page keeps its own setting): a charcoal study on toothed
   paper, the shadows rubbed in soft and then hatched over. The paintings hang in plain frames: a thin black
   frame on a white mount in the light, dark wood in the dark. */
:root{
  --bg:#f3f0ea; --ink:#1f1d1a; --dim:#6b6660; --line:#d9d4ca; --acc:#2e2b28;
  --gilt:#b8913a; --gilt-hi:#e3c77a;
  --f-disp:'Cormorant Garamond',Garamond,Georgia,serif; --f-body:'EB Garamond',Georgia,serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1a120b; --ink:#ead8b6; --dim:#a68d6c; --line:#3a2a1a; --acc:#d9a75a;
  --gilt:#c9a24a; --gilt-hi:#f0d68e;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0e0905;color:var(--ink);font:400 19px/1.65 var(--f-body)}
:root:not([data-theme="dark"]) body{background:#e9e5dd}
a{color:inherit;text-underline-offset:4px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.page{box-shadow:0 0 0 1px rgba(30,28,26,.18),0 40px 90px -36px rgba(20,18,16,.45)}
:root[data-theme="dark"] .page{background:radial-gradient(80% 60% at 18% 0%,rgba(217,167,90,.12),transparent 70%),color-mix(in srgb,var(--bg) var(--glass),transparent)}

.folio{padding:clamp(56px,12vh,120px) clamp(20px,5vw,56px) 16px}
.folio h1{margin:0;font:400 clamp(3.4rem,10vw,6.4rem)/1 var(--f-disp);color:var(--acc)}
:root[data-theme="dark"] .folio h1{text-shadow:0 0 40px rgba(217,167,90,.25)}
.wrap{padding-inline:clamp(20px,5vw,56px)}
.soon{margin:24px 0 0;font:italic 400 1.35rem var(--f-disp);color:var(--dim)}
/* the paintings, each hung in a plain gilt slip with a little air around it */
.hang{list-style:none;margin:40px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:clamp(28px,6vw,64px);align-items:flex-end}
.hang li{flex:1 1 260px;max-width:420px}
.hang .slip{display:block;padding:clamp(14px,2.6vw,28px);background:#fbfaf7;box-shadow:0 0 0 clamp(4px,.6vw,6px) #161514,0 26px 40px -24px rgba(0,0,0,.45)}
:root[data-theme="dark"] .hang .slip{padding:0;border:clamp(10px,1.5vw,16px) solid #4a2f1c;border-image:repeating-linear-gradient(90deg,#3b2414 0 3px,#5a3a22 3px 7px,#4a2e1a 7px 12px) 16;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),0 26px 40px -24px #000}
.hang img{display:block;width:100%;height:auto;background:center/cover no-repeat}
.hang p{margin:14px 0 0;font:italic 400 1.05rem var(--f-disp);color:var(--dim)}
footer{margin-top:120px;border-top:1px solid var(--line);padding-block:20px 24px;color:var(--dim);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{text-decoration:none}
</style>

<body>
<canvas class="backdrop tall" id="canvas" data-parallax=".3" aria-hidden="true"></canvas>
<div class="page">
<header class="bar"><div class="bar-in">
  <nav class="sites" aria-label="Sites"><a class="me away" href="https://jsonsummers.github.io/" title="Jason Summers: research, CV and links"><span>J</span><span class="x"><span>ason </span></span><span>S</span><span class="x"><span>ummers</span></span></a><a class="bm here" href="../" aria-current="true" title="Bucatini Mickey: films, games, photos and other hobbies"><span>B</span><span class="x"><span>ucatini </span></span><span>M</span><span class="x"><span>ickey</span></span></a></nav>
  <nav class="pages" aria-label="Pages"><a href="../game-dev/">Games</a><a href="../photos/">Photos</a><a href="./" aria-current="page">Art</a><a href="../films/">Film</a><a href="../writing/">Writing</a><button class="mode" id="mode" type="button" aria-label="Switch light or dark">Dark</button></nav>

<section class="folio"><h1>Art</h1></section>

<main class="wrap">
  <ul class="hang" id="hang" aria-label="Paintings"></ul>
  <script>/* the paintings, from assets/library.json (tools/photos.py crops each photograph to its canvas) */
  fetch('../assets/library.json').then(r=>r.ok?r.json():{}).then(d=>{
    const P=(d.photos||[]).filter(p=>(p.tags||[]).includes('painting')), esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    if(!P.length) return;
    document.getElementById('hang').innerHTML=P.map(p=>`<li><span class="slip"><img loading="lazy" decoding="async" width="${p.w}" height="${p.h}" alt="${esc(p.alt)}" style="background-image:url(${p.preview})" sizes="(max-width:700px) 90vw, 420px" srcset="../${p.files[640]} 640w, ../${p.files[1280]} 1280w" src="../${p.files[1280]}"></span>${p.title?`<p>${esc(p.title)}</p>`:''}</li>`).join('');
  }).catch(()=>{});</script>
</main>

<footer><div class="wrap"><span>Bucatini Mickey · Art</span><span><a href="../">Portfolio</a></span></div></footer>
</div>

<script>
(function(){
  const root=document.documentElement, cv=document.getElementById('canvas');
  function rng(seed){let s=seed>>>0;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  /* how much light reaches a point: a soft pool from the upper left, as from a high window */
  function light(x,y,W,H){const dx=(x-W*.2)/W, dy=(y-H*.16)/H; return Math.max(0,1-Math.sqrt(dx*dx*1.1+dy*dy*1.6)*1.45)}
  function paint(){
    const r=rng(1606), dpr=Math.min(2,devicePixelRatio||1), W=cv.clientWidth, H=cv.clientHeight, oil=root.dataset.theme==='dark';
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
    if(oil){
      // ground: umber darkness, warming to gold where the light falls
      const g=c.createRadialGradient(W*.2,H*.16,0,W*.2,H*.16,Math.max(W,H)*.85);
      g.addColorStop(0,'#c99448'); g.addColorStop(.18,'#8a5a2a'); g.addColorStop(.42,'#3d2614'); g.addColorStop(.75,'#170e07'); g.addColorStop(1,'#0b0704');
      c.fillStyle=g; c.fillRect(0,0,W,H);
      // glazes: broad, faint strokes laid round the light in layers, so the glow is mottled and brushed, never flat
      c.lineCap='round';
      for(let i=0;i<Math.round(W*H/1600);i++){
        const x=r()*W, y=r()*H, L=light(x,y,W,H); if(r()>L*1.4+.08) continue;
        const toL=Math.atan2(y-H*.16,x-W*.2)+Math.PI/2+(r()-.5)*.6, len=40+r()*120, w=14+r()*34;
        const tone=L>.35?[230,180,110]:L>.12?[150,96,48]:[40,24,12];
        c.strokeStyle=`rgba(${tone},${.025+L*.05})`; c.lineWidth=w;
        c.beginPath(); c.moveTo(x,y); c.quadraticCurveTo(x+Math.cos(toL)*len*.5+(r()-.5)*20,y+Math.sin(toL)*len*.5+(r()-.5)*20,x+Math.cos(toL)*len,y+Math.sin(toL)*len); c.stroke();
      }
    } else {
      // toothed paper: off-white, with a fine grain that catches the charcoal
      c.fillStyle='#efece6'; c.fillRect(0,0,W,H);
      const tooth=document.createElement('canvas'); tooth.width=tooth.height=96; const tc=tooth.getContext('2d'), im=tc.createImageData(96,96);
      for(let i=0;i<im.data.length;i+=4){const v=r(); im.data[i]=im.data[i+1]=im.data[i+2]=v<.5?40:255; im.data[i+3]=v<.5?Math.round(v*22):Math.round((v-.5)*18)} tc.putImageData(im,0,0);
      c.fillStyle=c.createPattern(tooth,'repeat'); c.fillRect(0,0,W,H);
      // the shadows rubbed in first: wide, soft strokes of charcoal smudged with a finger
      c.save(); c.filter='blur(7px)'; c.lineCap='round';
      for(let i=0;i<Math.round(W*H/2600);i++){
        const x=r()*W, y=r()*H, sh=1-light(x,y,W,H); if(r()>sh*sh*1.2) continue;
        const a=-.9+Math.sin(x*.004+y*.003)*.5+(r()-.5)*.4, len=50+r()*110;
        c.strokeStyle=`rgba(30,28,26,${.05+sh*.07})`; c.lineWidth=18+r()*30;
        c.beginPath(); c.moveTo(x,y); c.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len); c.stroke();
      }
      c.restore();
    }
    /* sketched hatching: short loose strokes in clusters, their direction drifting across the picture, more of
       them as it darkens and crossed where it is darkest. On paper they are bitten lines in sepia; in the
       painting they are scratched into the dark paint, so they show pale. */
    const cell=16, ink=oil?'232,196,140':'30,28,26';
    for(let y=0;y<H+cell;y+=cell) for(let x=0;x<W+cell;x+=cell){
      const L=light(x,y,W,H), shade=oil?Math.min(1,(1-L)*1.15-.25):1-L*1.6;
      if(shade<.18) continue;
      const base=-.9+Math.sin(x*.004+y*.003)*.5+Math.cos(y*.006)*.3, n=Math.round(shade*3.2+r()*.6);
      c.strokeStyle=`rgba(${ink},${oil?.05+shade*.09:.1+shade*.26})`; c.lineWidth=oil?.7:.6+r()*1.1; c.lineCap='round';   // charcoal lines vary in weight
      for(let k=0;k<n;k++){
        const px=x+r()*cell, py=y+r()*cell, len=9+r()*12, ang=base+(r()-.5)*.25+(k>=3&&shade>.6?1.25:0);
        const ex=px+Math.cos(ang)*len, ey=py+Math.sin(ang)*len;
        c.beginPath(); c.moveTo(px,py); c.quadraticCurveTo((px+ex)/2+(r()-.5)*2,(py+ey)/2+(r()-.5)*2,ex,ey); c.stroke();
      }
    }
    // a faint compass circle and its centre lines, sketched once in the lower right
    c.strokeStyle=oil?'rgba(217,167,90,.22)':'rgba(30,28,26,.3)'; c.lineWidth=.8;
    const R=Math.min(W,H)*.22, cx=W*.86, cy=H*.72;
    c.beginPath(); c.arc(cx,cy,R,0,Math.PI*2); c.stroke();
    c.beginPath(); c.moveTo(cx-R*1.2,cy); c.lineTo(cx+R*1.2,cy); c.moveTo(cx,cy-R*1.2); c.lineTo(cx,cy+R*1.2); c.stroke();
  }

  /* site-wide light/dark switch: dark is the painting, light the etching */
  const btn=document.getElementById('mode');
  const set=m=>{if(m==='dark')root.dataset.theme='dark';else delete root.dataset.theme;btn.textContent=m==='dark'?'Light':'Dark';paint()};
  let m='light';try{m=localStorage.getItem('bm-theme-art')||'light'}catch(e){}   // this page keeps its own setting, light by default
  btn.onclick=()=>{m=m==='dark'?'light':'dark';try{localStorage.setItem('bm-theme-art',m)}catch(e){}set(m)};
  let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(paint,200)});
  set(m);
})();
</script>
<script src="../assets/parallax.js"></script>
<script src="../assets/bar.js" defer></script>
