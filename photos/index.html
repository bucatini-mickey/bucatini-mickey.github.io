<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photos · Bucatini Mickey</title>
<meta name="description" content="Photographs by Mickey.">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="preload" href="../assets/fonts/cormorant-garamond-500-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/mulish-500-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* A light box whose colours come from the photograph on it. The hero image is sampled once it loads;
   its darkest common colour becomes the ground, its lightest the ink, its most saturated the accent.
   Until then (or with no image) the page is a neutral grey that does not tint the photos. */
:root{
  --bg:#1b1b1a; --ink:#ecebe7; --dim:#a3a29c; --line:#323230; --acc:#d6a14a;
  --f-disp:'Cormorant Garamond',Garamond,Georgia,serif; --f-body:'Mulish',system-ui,sans-serif;
  --here-size:1.1rem;
  color-scheme:dark;
}
:root[data-theme="light"]{--bg:#efeee9;--ink:#1d1c1a;--dim:#6b6a64;--line:#d9d7cf;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#2a2a28;color:var(--ink);font:300 17px/1.7 var(--f-body)}
.page{transition:background-color .8s,color .8s}
/* the backdrop is the hero photograph itself, once there is one; until then a neutral grey that does not tint anything */
.photo-bg{background:radial-gradient(120% 90% at 50% 30%,#4a4a47,#1c1c1b) center/cover no-repeat}
:root[data-theme="light"] .photo-bg{background:radial-gradient(120% 90% at 50% 30%,#e9e8e3,#bdbcb6)}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.hero{position:relative;height:min(64vh,640px);background:color-mix(in srgb,var(--ink) 6%,var(--bg))}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font:italic 400 1.4rem var(--f-disp)}
.hero h1{position:absolute;left:0;right:0;bottom:0;margin:0;padding:0 clamp(16px,5vw,48px) 28px;font:400 clamp(3rem,10vw,6rem)/1 var(--f-disp);color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.4)}
.swatches{display:flex;gap:6px;margin:14px 0 0;padding-inline:clamp(16px,5vw,48px)}
.swatches i{width:18px;height:18px;border-radius:50%;border:1px solid var(--line)}
.wrap{padding-inline:clamp(16px,5vw,48px)}
.hero img{background:center/cover no-repeat}
.grid{list-style:none;margin:40px 0 0;padding:0;columns:3 260px;column-gap:14px}
.grid li{break-inside:avoid;margin-bottom:14px}
.grid button{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:2px;overflow:hidden}
.grid img{display:block;width:100%;height:auto;background:center/cover no-repeat;transition:transform .5s ease,filter .5s ease}
.grid button:hover img{transform:scale(1.025);filter:brightness(1.06)}
/* the light box: one photograph at a time, as large as the window allows */
.lb{position:fixed;inset:0;z-index:20;margin:0;width:100%;height:100%;max-width:none;max-height:none;border:0;padding:0;background:rgba(8,8,8,.94);color:#eee}
.lb::backdrop{background:transparent}
.lb img{position:absolute;inset:0;margin:auto;max-width:94vw;max-height:88vh;object-fit:contain;background:center/contain no-repeat}
.lb p{position:absolute;left:0;right:0;bottom:12px;margin:0;text-align:center;font:italic 400 1.05rem var(--f-disp);color:#bbb;padding-inline:16px}
.lb button{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;color:#ddd;font:300 2.4rem/1 var(--f-body);padding:16px;cursor:pointer;opacity:.6}
.lb button:hover{opacity:1}
.lb .prev{left:4px}.lb .next{right:4px}.lb .close{top:28px;right:8px;transform:none;font-size:1.6rem}
footer{margin-top:96px;border-top:1px solid var(--line);padding-block:20px 24px;color:var(--dim);font-size:.85rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{text-decoration:none}
</style>
<link rel="stylesheet" href="../assets/bar.css">
</head>
<body>
<div class="backdrop photo-bg" id="bg" aria-hidden="true"></div>
<div class="page">
<header class="bar"><div class="bar-in">
  <nav class="sites" aria-label="Sites"><a class="me away" href="https://jsonsummers.github.io/" title="Jason Summers: research, CV and links"><span>J</span><span class="x"><span>ason </span></span><span>S</span><span class="x"><span>ummers</span></span></a><a class="bm here" href="../" aria-current="true" title="Bucatini Mickey: films, games, photos and other hobbies"><span>B</span><span class="x"><span>ucatini </span></span><span>M</span><span class="x"><span>ickey</span></span></a></nav>
  <nav class="pages" aria-label="Pages"><a href="../films/">Film</a><a href="../game-dev/">Games</a><a href="./" aria-current="page">Photos</a><a href="../writing/">Writing</a><a href="../art/">Art</a><button class="mode" id="mode" type="button" aria-label="Switch light or dark">Light</button></nav>
</div></header>

<div class="hero">
  <h1>Photos</h1>
</div>
<div class="swatches" id="sw" aria-hidden="true"></div>

<main class="wrap">
  <ul class="grid" id="grid" aria-label="Photographs"></ul>
</main>
<dialog class="lb" id="lb" aria-label="Photograph"><img id="lbimg" alt=""><p id="lbcap"></p>
  <button class="prev" id="lbprev" type="button" aria-label="Previous photograph">‹</button><button class="next" id="lbnext" type="button" aria-label="Next photograph">›</button><button class="close" id="lbclose" type="button" aria-label="Close">✕</button></dialog>

<footer><div class="wrap"><span>Bucatini Mickey · Photos</span><span><a href="https://www.instagram.com/bucatini_mickey/">Instagram ↗</a> · <a href="../">Portfolio</a></span></div></footer>
</div>

<script>
(function(){
  const root=document.documentElement,btn=document.getElementById('mode');
  /* palette from the hero: sample a small copy, bucket the colours, pick ground, ink and accent */
  function theme(img){
    const S=48, cv=document.createElement('canvas'); cv.width=S; cv.height=Math.round(S*img.naturalHeight/img.naturalWidth);
    const c=cv.getContext('2d',{willReadFrequently:true}); c.drawImage(img,0,0,cv.width,cv.height);
    const d=c.getImageData(0,0,cv.width,cv.height).data, buckets=new Map();
    for(let i=0;i<d.length;i+=4){const k=(d[i]>>4)<<8|(d[i+1]>>4)<<4|(d[i+2]>>4);const b=buckets.get(k)||[0,0,0,0];b[0]+=d[i];b[1]+=d[i+1];b[2]+=d[i+2];b[3]++;buckets.set(k,b)}
    const cols=[...buckets.values()].filter(b=>b[3]>3).map(b=>[b[0]/b[3],b[1]/b[3],b[2]/b[3],b[3]]);
    const L=c=>.2126*c[0]+.7152*c[1]+.0722*c[2], sat=c=>{const mx=Math.max(c[0],c[1],c[2]),mn=Math.min(c[0],c[1],c[2]);return mx?(mx-mn)/mx:0};
    const byCount=cols.sort((a,b)=>b[3]-a[3]).slice(0,24);
    const dark=[...byCount].sort((a,b)=>L(a)-L(b))[0], light=[...byCount].sort((a,b)=>L(b)-L(a))[0];
    const acc=[...byCount].sort((a,b)=>sat(b)*Math.sqrt(b[3])-sat(a)*Math.sqrt(a[3]))[0];
    const css=(c,f=1)=>`rgb(${c.slice(0,3).map(v=>Math.round(Math.min(255,v*f))).join(',')})`;
    const isLight=root.dataset.theme==='light';
    const ground=isLight?light:dark, ink=isLight?dark:light;
    root.style.setProperty('--bg',css(ground,isLight?1:.55));
    root.style.setProperty('--ink',css(ink,isLight?.6:1.1));
    root.style.setProperty('--acc',css(acc));
    document.getElementById('bg').style.background=`linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),url(${img.currentSrc||img.src}) center/cover`;
    document.getElementById('sw').innerHTML=byCount.slice(0,8).map(c=>`<i style="background:${css(c)}"></i>`).join('');
  }
  /* the photographs, from assets/library.json (made by tools/photos.py): a different one heads the page each visit
     and gives it its colours; the rest are laid out below, each shown first as its tiny blurred preview */
  let img=null;
  const apply=()=>{if(img&&img.complete&&img.naturalWidth)theme(img)};
  const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const set_=(ph,k)=>`../${ph.files[k]}`;
  fetch('../assets/library.json').then(r=>r.ok?r.json():{photos:[]}).then(d=>{
    const P=(d.photos||[]).filter(p=>(p.tags||['gallery']).includes('gallery')); if(!P.length) return;
    const wide=P.filter(p=>p.w>=p.h), h=(wide.length?wide:P)[Math.floor(Math.random()*(wide.length||P.length))];
    img=new Image(); img.id='hero'; img.alt=h.alt||''; img.decoding='async'; img.fetchPriority='high';
    img.style.backgroundImage=`url(${h.preview})`;
    img.sizes='100vw'; img.srcset=`${set_(h,1280)} 1280w, ${set_(h,2560)} 2560w`; img.src=set_(h,1280);
    img.addEventListener('load',apply); document.querySelector('.hero').prepend(img);
    const grid=document.getElementById('grid');
    grid.innerHTML=P.map((p,i)=>`<li><button type="button" data-i="${i}" aria-label="Open: ${esc(p.alt||'photograph '+(i+1))}"><img loading="lazy" decoding="async" width="${p.w}" height="${p.h}" alt="${esc(p.alt)}" style="background-image:url(${p.preview})" sizes="(max-width:700px) 92vw, 320px" srcset="${set_(p,640)} 640w, ${set_(p,1280)} 1280w" src="${set_(p,640)}"></button></li>`).join('');
    // the light box
    const lb=document.getElementById('lb'), li=document.getElementById('lbimg'), cap=document.getElementById('lbcap'); let at=0;
    const show=i=>{ at=(i+P.length)%P.length; const p=P[at]; li.style.backgroundImage=`url(${set_(p,1280)})`; li.alt=p.alt||''; li.src=set_(p,2560); cap.textContent=p.alt||'' };
    grid.addEventListener('click',e=>{const b=e.target.closest('button[data-i]'); if(!b) return; show(+b.dataset.i); lb.showModal()});
    document.getElementById('lbprev').onclick=()=>show(at-1); document.getElementById('lbnext').onclick=()=>show(at+1); document.getElementById('lbclose').onclick=()=>lb.close();
    lb.addEventListener('click',e=>{if(e.target===lb) lb.close()});
    lb.addEventListener('keydown',e=>{if(e.key==='ArrowLeft') show(at-1); if(e.key==='ArrowRight') show(at+1)});
    let x0=null; lb.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
    lb.addEventListener('touchend',e=>{if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>50) show(at+(dx<0?1:-1)); x0=null});
  }).catch(()=>{});
  const set=m=>{if(m==='light')root.dataset.theme='light';else delete root.dataset.theme;btn.textContent=m==='light'?'Dark':'Light';root.style.cssText='';apply()};
  let m='dark';try{m=localStorage.getItem('bm-theme')||'dark'}catch(e){}
  set(m); btn.onclick=()=>{m=m==='dark'?'light':'dark';try{localStorage.setItem('bm-theme',m)}catch(e){}set(m)};
})();
</script>
<script src="../assets/bar.js" defer></script>
</body>
</html>
