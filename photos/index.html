<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
/* A light box whose colours come from the photograph on it. The hero image is sampled once it loads;
   its darkest common colour becomes the ground, its lightest the ink, its most saturated the accent.
   Until then (or with no image) the page is a neutral grey that does not tint the photos. */
:root{
  --bg:#1b1b1a; --ink:#ecebe7; --dim:#a3a29c; --line:#323230; --acc:#d6a14a;
  --f-disp:'Cormorant Garamond',Garamond,Georgia,serif; --f-body:'Mulish',system-ui,sans-serif;
  --here-size:1.1rem;
  color-scheme:dark;
}
:root[data-theme="light"]{--bg:#efeee9;--ink:#1d1c1a;--dim:#6b6a64;--line:#d9d7cf;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#2a2a28;color:var(--ink);font:300 17px/1.7 var(--f-body)}
.page{transition:background-color .8s,color .8s}
/* the backdrop is the hero photograph itself, once there is one; until then a neutral grey that does not tint anything */
.photo-bg{background:radial-gradient(120% 90% at 50% 30%,#4a4a47,#1c1c1b) center/cover no-repeat}
:root[data-theme="light"] .photo-bg{background:radial-gradient(120% 90% at 50% 30%,#e9e8e3,#bdbcb6)}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.hero{position:relative;height:min(64vh,640px);background:color-mix(in srgb,var(--ink) 6%,var(--bg))}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font:italic 400 1.4rem var(--f-disp)}
.hero h1{position:absolute;left:0;right:0;bottom:0;margin:0;padding:0 clamp(16px,5vw,48px) 28px;font:400 clamp(3rem,10vw,6rem)/1 var(--f-disp);color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.4)}
.swatches{display:flex;gap:6px;margin:14px 0 0;padding-inline:clamp(16px,5vw,48px)}
.swatches i{width:18px;height:18px;border-radius:50%;border:1px solid var(--line)}
.wrap{padding-inline:clamp(16px,5vw,48px)}
.soon{margin:48px 0 0;font:italic 400 1.35rem var(--f-disp);color:var(--dim)}
.grid{list-style:none;margin:48px 0 0;padding:0;columns:3 280px;column-gap:16px}
.grid li{break-inside:avoid;margin-bottom:16px}
.grid .ph{aspect-ratio:3/2;background:color-mix(in srgb,var(--ink) 6%,var(--bg));border:1px dashed var(--line)}
.grid li:nth-child(3n+2) .ph{aspect-ratio:2/3}
footer{margin-top:96px;border-top:1px solid var(--line);padding-block:20px 24px;color:var(--dim);font-size:.85rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{text-decoration:none}
</style>
<link rel="stylesheet" href="../assets/bar.css">
</head>

</div>

<script>
(function(){
  const root=document.documentElement,btn=document.getElementById('mode');
  /* palette from the hero: sample a small copy, bucket the colours, pick ground, ink and accent */
  function theme(img){
    const S=48, cv=document.createElement('canvas'); cv.width=S; cv.height=Math.round(S*img.naturalHeight/img.naturalWidth);
    const c=cv.getContext('2d',{willReadFrequently:true}); c.drawImage(img,0,0,cv.width,cv.height);
    const d=c.getImageData(0,0,cv.width,cv.height).data, buckets=new Map();
    for(let i=0;i<d.length;i+=4){const k=(d[i]>>4)<<8|(d[i+1]>>4)<<4|(d[i+2]>>4);const b=buckets.get(k)||[0,0,0,0];b[0]+=d[i];b[1]+=d[i+1];b[2]+=d[i+2];b[3]++;buckets.set(k,b)}
    const cols=[...buckets.values()].filter(b=>b[3]>3).map(b=>[b[0]/b[3],b[1]/b[3],b[2]/b[3],b[3]]);
    const L=c=>.2126*c[0]+.7152*c[1]+.0722*c[2], sat=c=>{const mx=Math.max(c[0],c[1],c[2]),mn=Math.min(c[0],c[1],c[2]);return mx?(mx-mn)/mx:0};
    const byCount=cols.sort((a,b)=>b[3]-a[3]).slice(0,24);
    const dark=[...byCount].sort((a,b)=>L(a)-L(b))[0], light=[...byCount].sort((a,b)=>L(b)-L(a))[0];
    const acc=[...byCount].sort((a,b)=>sat(b)*Math.sqrt(b[3])-sat(a)*Math.sqrt(a[3]))[0];
    const css=(c,f=1)=>`rgb(${c.slice(0,3).map(v=>Math.round(Math.min(255,v*f))).join(',')})`;
    const isLight=root.dataset.theme==='light';
    const ground=isLight?light:dark, ink=isLight?dark:light;
    root.style.setProperty('--bg',css(ground,isLight?1:.55));
    root.style.setProperty('--ink',css(ink,isLight?.6:1.1));
    root.style.setProperty('--acc',css(acc));
    document.getElementById('bg').style.background=`linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),url(${img.currentSrc||img.src}) center/cover`;
    document.getElementById('sw').innerHTML=byCount.slice(0,8).map(c=>`<i style="background:${css(c)}"></i>`).join('');
  }
  const img=document.getElementById('hero');
  const apply=()=>{if(img&&img.complete&&img.naturalWidth)theme(img)};
  if(img) img.addEventListener('load',apply);
  const set=m=>{if(m==='light')root.dataset.theme='light';else delete root.dataset.theme;btn.textContent=m==='light'?'Dark':'Light';root.style.cssText='';apply()};
  let m='dark';try{m=localStorage.getItem('bm-theme')||'dark'}catch(e){}
  set(m); btn.onclick=()=>{m=m==='dark'?'light':'dark';try{localStorage.setItem('bm-theme',m)}catch(e){}set(m)};
})();
</script>
<script src="../assets/bar.js" defer></script>
</body>
